name: Sync Markdown index

on:
  push:
    branches:
      - main
    paths:
      - "*.md"
      - "**/*.md"
      - "*.MD"
      - "**/*.MD"
      - "scripts/generate_index.py"
      - ".github/workflows/sync-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate index.html
        run: python scripts/generate_index.py

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already up to date"
            exit 0
          fi

          git config user.name "Sourav Ahmed"
          git config user.email "sourav.ahmed5654@gmail.com"
          git add index.html
          git commit -m "chore: sync Markdown index"
          git push
