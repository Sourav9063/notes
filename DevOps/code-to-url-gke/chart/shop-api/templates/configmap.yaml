apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop-api.name" . }}
  labels:
    {{- include "shop-api.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.ports.http | quote }}
  METRICS_PORT: {{ .Values.ports.metrics | quote }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
